name: Build FullGram

on:
  push:
    branches: [ master, 'release/**' ]
    paths-ignore:
      - 'tools/cloudflare-worker/**'
      - '**.md'
  pull_request:
    branches: [ master, 'release/**' ]
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: release_arm64
        type: choice
        options:
          - release_arm64
          - debug_arm64
          - release_sim_arm64
      create_release:
        description: Create GitHub Release with Telegram.ipa
        required: false
        default: true
        type: boolean
      skip_cache:
        description: Skip restoring/saving Bazel disk cache
        required: false
        default: false
        type: boolean

concurrency:
  group: fullgram-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  checks:
    name: Pre-build Source & Config Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run FullGram source and config checks
        run: python3 tools/ci_checks.py

  build:
    name: Build FullGram iOS
    needs: checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 240

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Select Xcode and report resources
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          sudo chown "$(whoami)" /Users/Shared
          mkdir -p /Users/Shared/bazel-disk-cache

          REQ_XCODE=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          SELECTED_APP="/Applications/Xcode_${REQ_XCODE}.app"
          XCODE_OVERRIDE_FLAG=""

          if [ -d "${SELECTED_APP}/Contents/Developer" ]; then
            sudo xcode-select -s "${SELECTED_APP}/Contents/Developer"
          else
            FALLBACK_APP=$(python3 - <<'PY'
          import re
          from pathlib import Path

          def version_key(p: Path):
              nums = [int(x) for x in re.findall(r"\d+", p.name)]
              return (1 if nums else 0, nums, p.name)

          apps = [
              p for p in Path("/Applications").glob("Xcode*.app")
              if (p / "Contents/Developer").is_dir()
          ]
          apps.sort(key=version_key)
          print(str(apps[-1]) if apps else "")
          PY
          )
            if [ -z "$FALLBACK_APP" ] || [ ! -d "${FALLBACK_APP}/Contents/Developer" ]; then
              echo "::error::No Xcode installation found in /Applications"
              exit 1
            fi
            sudo xcode-select -s "${FALLBACK_APP}/Contents/Developer"
            XCODE_OVERRIDE_FLAG="--overrideXcodeVersion"
            echo "::warning::Requested Xcode ${REQ_XCODE} not installed on runner; using ${FALLBACK_APP} with ${XCODE_OVERRIDE_FLAG}"
          fi

          echo "XCODE_OVERRIDE_FLAG=${XCODE_OVERRIDE_FLAG}" >> "$GITHUB_ENV"
          echo "=== System Info ==="
          sw_vers
          xcode-select -p
          xcodebuild -version
          echo "CPU cores: $(sysctl -n hw.ncpu)"
          echo "Memory (bytes): $(sysctl -n hw.memsize)"
          df -h / /Users/Shared 2>/dev/null || df -h /

      - name: Verify macOS build dependencies
        run: |
          set -euo pipefail
          MISSING=()
          check_cmd() {
            local cmd="$1"
            local formula="$2"
            if ! command -v "$cmd" >/dev/null 2>&1; then
              MISSING+=("$formula")
            fi
          }

          check_cmd python3 python3
          check_cmd git git
          check_cmd curl curl
          check_cmd zip zip
          check_cmd unzip unzip
          check_cmd cmake cmake
          check_cmd ninja ninja
          check_cmd yasm yasm
          check_cmd pkg-config pkg-config
          check_cmd autoconf autoconf
          check_cmd automake automake
          check_cmd glibtoolize libtool

          if [ "${#MISSING[@]}" -gt 0 ]; then
            UNIQUE_FORMULAS=$(printf "%s\n" "${MISSING[@]}" | sort -u | tr '\n' ' ')
            echo "Installing missing Homebrew packages: ${UNIQUE_FORMULAS}"
            HOMEBREW_NO_AUTO_UPDATE=1 brew install $UNIQUE_FORMULAS
          else
            echo "All required macOS build tools are already installed."
          fi

          # VoidGram-proven restricted-PATH symlinks (ccache + sysctl) and MetalToolchain preflight
          bash tools/ci/prepare_macos.sh

      - name: Validate Telegram credentials
        env:
          SECRET_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          SECRET_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-input"
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path

          api_id = os.environ.get("SECRET_API_ID", "").strip()
          api_hash = os.environ.get("SECRET_API_HASH", "").strip()
          cfg_path = Path("build-system/appstore-configuration.json")
          cfg = json.loads(cfg_path.read_text(encoding="utf-8"))

          if api_id or api_hash:
              if not (api_id and api_hash):
                  print("::error::Set BOTH TELEGRAM_API_ID and TELEGRAM_API_HASH secrets, or leave both unset.")
                  sys.exit(1)
              if not re.fullmatch(r"[0-9]+", api_id) or int(api_id) <= 0:
                  print("::error::TELEGRAM_API_ID must be a positive integer.")
                  sys.exit(1)
              if not re.fullmatch(r"[0-9a-fA-F]{32}", api_hash):
                  print("::error::TELEGRAM_API_HASH must be a 32-character hex string.")
                  sys.exit(1)
              cfg["api_id"] = api_id
              cfg["api_hash"] = api_hash
              print("Validated custom TELEGRAM_API_ID / TELEGRAM_API_HASH from GitHub Secrets.")
          else:
              print("::notice::Using default api_id/api_hash from build-system/appstore-configuration.json. Add TELEGRAM_API_ID and TELEGRAM_API_HASH secrets to use your own.")

          out_path = Path(os.environ["GITHUB_WORKSPACE"]) / "build-input" / "ci-configuration.json"
          out_path.write_text(json.dumps(cfg, indent=2) + "\n", encoding="utf-8")
          PY
          echo "BUILD_CONFIG_PATH=$GITHUB_WORKSPACE/build-input/ci-configuration.json" >> "$GITHUB_ENV"

      - name: Run FullGram source and submodule checks
        run: python3 tools/ci_checks.py --require-submodules

      - name: Restore Bazel disk cache
        id: bazel-cache
        if: inputs.skip_cache != true
        uses: actions/cache/restore@v4
        with:
          path: /Users/Shared/bazel-disk-cache
          key: bazel-disk-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json') }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json') }}-
            bazel-disk-xcode27-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare canonical source directory
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          sudo chown "$(whoami)" /Users/Shared
          mkdir -p /Users/Shared/bazel-disk-cache
          rm -rf /Users/Shared/telegram-ios
          cp -ac "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios 2>/dev/null || cp -a "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Build FullGram IPA
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration || 'release_arm64' }}
        run: |
          set -euo pipefail
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT=/private/var/tmp/_bazel_containerhost
          CACHE_DIR=/Users/Shared/bazel-disk-cache

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset | tr -d '[:space:]')"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          COMMIT_COUNT="$(git rev-list --count HEAD 2>/dev/null || echo 1)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

          mkdir -p "$SOURCE_DIR/build-input"
          cp "$BUILD_CONFIG_PATH" "$SOURCE_DIR/build-input/active-configuration.json"

          HOST_MACOS_MAJOR="$(sw_vers -productVersion | awk -F. '{print $1}')"
          HOST_MACOS_TARGET="${HOST_MACOS_MAJOR}.0"
          if [ "$HOST_MACOS_MAJOR" -lt 26 ]; then
            echo "Pinning apple_support macOS host target to ${HOST_MACOS_TARGET} (running macOS $(sw_vers -productVersion))"
            HOST_MACOS_MAJOR="$HOST_MACOS_MAJOR" python3 - <<'PY'
          import os
          from pathlib import Path

          target = f'{os.environ["HOST_MACOS_MAJOR"]}.0'
          cc_cfg = Path("build-system/bazel-rules/apple_support/crosstool/cc_toolchain_config.bzl")
          if cc_cfg.is_file():
              text = cc_cfg.read_text(encoding="utf-8")
              needle = "    target_os_version = xcode_config.minimum_os_for_platform_type(platform_type)"
              replacement = (
                  "    target_os_version = xcode_config.minimum_os_for_platform_type(platform_type)\n"
                  "    if platform_type == apple_common.platform_type.macos:\n"
                  f'        target_os_version = apple_common.dotted_version("{target}")'
              )
              if needle in text and "platform_type == apple_common.platform_type.macos:\n        target_os_version" not in text:
                  cc_cfg.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
                  print(f"Patched {cc_cfg} macOS target_os_version -> {target}")

          xcode_cfg = Path("build-system/bazel-rules/apple_support/xcode/xcode_config.bzl")
          if xcode_cfg.is_file():
              text = xcode_cfg.read_text(encoding="utf-8")
              needle = '    macos_minimum_os = read_possibly_native_flag(ctx, "macos_minimum_os") or macos_sdk_version'
              replacement = f'    macos_minimum_os = read_possibly_native_flag(ctx, "macos_minimum_os") or apple_common.dotted_version("{target}")'
              if needle in text:
                  xcode_cfg.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
                  print(f"Patched {xcode_cfg} macos_minimum_os fallback -> {target}")
          PY
          fi

          # Apply VoidGram's unsigned rules_apple patch and Bazel unsigned build flags in $SOURCE_DIR
          RULES_APPLE="$SOURCE_DIR/build-system/bazel-rules/rules_apple"
          RULES_PATCH="$SOURCE_DIR/tools/ci/unsigned-build-rules.patch"
          if ! git -C "$RULES_APPLE" apply --reverse --check "$RULES_PATCH" >/dev/null 2>&1; then
            git -C "$RULES_APPLE" apply --check "$RULES_PATCH"
            git -C "$RULES_APPLE" apply "$RULES_PATCH"
            echo "Applied unsigned-build-rules.patch to rules_apple"
          fi

          python3 - <<'PY'
          from pathlib import Path

          rc = Path(".bazelrc")
          text = rc.read_text(encoding="utf-8")
          additions = [
              "build --//Telegram:disableProvisioningProfiles",
              "build --//Telegram:disableExtensions",
              "build --features=ayu_unsigned_compilation --features=disable_legacy_signing",
          ]
          missing = [line for line in additions if line not in text]
          if missing:
              rc.write_text(text.rstrip() + "\n" + "\n".join(missing) + "\n", encoding="utf-8")
          PY

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$CACHE_DIR" \
            ${XCODE_OVERRIDE_FLAG:-} \
            build \
            --enableParallelSwiftmoduleGeneration \
            --xcodeManagedCodesigning \
            --disableProvisioningProfiles \
            --skipDsym \
            --continueOnError \
            --configurationPath="build-input/active-configuration.json" \
            --configuration="$BUILD_CONFIGURATION" \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="$SOURCE_DIR/build/artifacts" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          IPA_PATH="$SOURCE_DIR/build/artifacts/Telegram.ipa"
          if [ ! -s "$IPA_PATH" ]; then
            echo "::error::Build finished without producing Telegram.ipa"
            exit 1
          fi

          python3 - "$IPA_PATH" <<'PY'
          import stat, sys, zipfile
          from pathlib import Path

          ipa_path = Path(sys.argv[1])
          tmp_path = ipa_path.with_suffix(".ipa.tmp")
          orig_size = ipa_path.stat().st_size
          with zipfile.ZipFile(ipa_path, "r") as zin, zipfile.ZipFile(
              tmp_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9
          ) as zout:
              for info in zin.infolist():
                  data = zin.read(info.filename)
                  is_symlink = stat.S_ISLNK(info.external_attr >> 16)
                  info.compress_type = zipfile.ZIP_STORED if is_symlink else zipfile.ZIP_DEFLATED
                  zout.writestr(info, data)
          if tmp_path.stat().st_size < orig_size:
              tmp_path.replace(ipa_path)
              new_size = ipa_path.stat().st_size
              print(f"Recompressed IPA: {orig_size / (1024*1024):.2f} MiB -> {new_size / (1024*1024):.2f} MiB")
          else:
              tmp_path.unlink(missing_ok=True)
          PY

          python3 - "$IPA_PATH" "$BUILD_CONFIGURATION" <<'PY'
          import hashlib, plistlib, struct, sys, zipfile
          from pathlib import Path

          ipa_path = Path(sys.argv[1])
          cfg = sys.argv[2]
          with zipfile.ZipFile(ipa_path) as zf:
              info = plistlib.loads(zf.read("Payload/Telegram.app/Info.plist"))
              binary = zf.read("Payload/Telegram.app/" + info["CFBundleExecutable"])
              if binary[:4] != b"\xcf\xfa\xed\xfe":
                  raise SystemExit("Expected 64-bit Mach-O executable")
              if int.from_bytes(binary[4:8], "little") != 0x0100000C:
                  raise SystemExit("Expected arm64 Mach-O architecture")
              expected_platform = 7 if "sim" in cfg else 2
              platform_id = None
              cursor = 32
              for _ in range(struct.unpack_from("<I", binary, 16)[0]):
                  cmd_id, cmd_size = struct.unpack_from("<II", binary, cursor)
                  if cmd_id == 0x32 and cmd_size >= 24:
                      platform_id = struct.unpack_from("<I", binary, cursor + 8)[0]
                  cursor += cmd_size
              if platform_id != expected_platform:
                  raise SystemExit(f"Wrong Mach-O platform: expected {expected_platform}, got {platform_id}")
          sha = hashlib.sha256(ipa_path.read_bytes()).hexdigest()
          print(f"Verified unsigned arm64 IPA ({ipa_path.stat().st_size / (1024*1024):.2f} MiB), sha256={sha}")
          PY

      - name: Show errors on the run page
        if: failure()
        run: |
          {
            echo "### Build Errors"
            echo '```text'
            if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
              grep -E "(^ERROR:|error:|fatal error:|FAILED:|AssertionError|Exception:)" "$GITHUB_WORKSPACE/build.log" | tail -n 120 || tail -n 80 "$GITHUB_WORKSPACE/build.log"
            else
              echo "No build.log captured (failed before Make.py started)."
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stage build artifacts
        if: success()
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/build"
          cp -a /Users/Shared/telegram-ios/build/artifacts "$GITHUB_WORKSPACE/build/artifacts"
          ls -lh "$GITHUB_WORKSPACE/build/artifacts"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FullGram-ipa
          path: build/artifacts/Telegram.ipa
          if-no-files-found: error

      - name: Upload DSYMs artifact
        uses: actions/upload-artifact@v4
        with:
          name: FullGram-dsyms
          path: build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: ignore

      - name: Attest the IPA
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/artifacts/Telegram.ipa

      - name: Free disk space before saving cache
        if: always()
        run: |
          chmod -R u+w /private/var/tmp/_bazel_containerhost 2>/dev/null || true
          rm -rf /Users/Shared/telegram-ios /private/var/tmp/_bazel_containerhost || true
          python3 - <<'PY'
          import os
          from pathlib import Path

          cache_dir = Path("/Users/Shared/bazel-disk-cache")
          if not cache_dir.is_dir():
              raise SystemExit(0)

          max_bytes = 5_200 * 1024 * 1024
          files = []
          total = 0
          for root, _, names in os.walk(cache_dir):
              for name in names:
                  p = Path(root) / name
                  try:
                      st = p.stat()
                      files.append((st.st_mtime, st.st_size, p))
                      total += st.st_size
                  except OSError:
                      pass

          if total > max_bytes:
              files.sort(key=lambda item: item[0])
              for _, size, p in files:
                  if total <= max_bytes:
                      break
                  try:
                      p.unlink()
                      total -= size
                  except OSError:
                      pass
          print(f"Bazel disk cache size ready for save: {total / (1024 * 1024):.1f} MB")
          PY

      - name: Save Bazel disk cache
        if: (!cancelled()) && inputs.skip_cache != true && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Users/Shared/bazel-disk-cache
          key: bazel-disk-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json') }}-${{ github.sha }}

      - name: Create GitHub Release
        if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.create_release))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-${BUILD_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
          fi

          FILES=("build/artifacts/Telegram.ipa")
          if [ -f "build/artifacts/Telegram.DSYMs.zip" ]; then
            FILES+=("build/artifacts/Telegram.DSYMs.zip")
          fi

          gh release create "$TAG" "${FILES[@]}" \
            --title "FullGram v1.0.0 (${APP_VERSION} • ${BUILD_NUMBER})" \
            --notes "Unsigned iOS build of FullGram v1.0.0 (${APP_VERSION} • ${BUILD_NUMBER}) from commit ${GITHUB_SHA}."
